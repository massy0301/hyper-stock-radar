<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hyperliquid 美股异动雷达 V4</title>
<style>
:root{--bg:#090d12;--card:#111820;--line:#26333e;--text:#eef4f8;--muted:#8b9baa;--up:#24d17e;--dn:#ff5c6c;--blue:#62adff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:4;padding:14px 16px;background:#090d12f5;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0 0 10px}.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#121a22;color:var(--text)}
button{cursor:pointer}.active{border-color:var(--blue);color:#b3d8ff}.status{margin-left:auto;color:var(--muted)}
.info{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px}.card{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.card h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid #1a252e;text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted)}th:first-child,td:first-child{text-align:left}.up{color:var(--up);font-weight:700}.dn{color:var(--dn);font-weight:700}.muted{color:var(--muted)}
.badge{font-size:10px;background:#1b2a36;padding:2px 5px;border-radius:4px;margin-left:5px;color:#bad0df}
details{margin:0 12px 12px;padding:10px 12px;background:#0e151c;border:1px solid var(--line);border-radius:10px;color:var(--muted)}
footer{padding:0 14px 16px;color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:900px){.grid{grid-template-columns:1fr}.status{width:100%;margin:0}}
</style></head><body>
<header><h1>🇺🇸 Hyperliquid 美股超短线雷达 V4 · 四周期对比</h1>
<div class="ctl"><button id="up" class="active">涨幅榜</button><button id="down">跌幅榜</button>
<input id="q" placeholder="NVDA / INTC / TSLA…"><select id="limit"><option>10</option><option selected>20</option><option>50</option><option>100</option></select>
<button id="refresh">立即刷新</button><span id="status" class="status">准备连接 Hyperliquid…</span></div></header>
<div id="info" class="info">正在读取全部 HIP-3 DEX，并识别美股/ETF。</div>
<div class="grid"><section class="card"><h2>⚡ 5分钟排名</h2><div id="m5"></div></section>
<section class="card"><h2>🚀 15分钟排名</h2><div id="m15"></div></section>
<section class="card"><h2>🔥 1小时排名</h2><div id="h1"></div></section>
<section class="card"><h2>📅 1天排名</h2><div id="d1"></div></section></div>
<details><summary>诊断信息（列表为空时点这里）</summary><pre id="debug"></pre></details>
<footer>数据源：Hyperliquid 公共 Info API。四列同时对比 5分钟 / 15分钟 / 1小时 / 1天涨跌幅排名。30 秒自动刷新。仅用于行情监控。</footer>
<script>
const API="https://api.hyperliquid.xyz/info";let rows=[],direction=1,last=0,busy=false;
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function post(body){const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
function canon(d,n){n=String(n||"");return n.includes(":")?n:(d?d+":"+n:n)}
function sym(n){return String(n||"").split(":").pop().replace(/[-_/](USD|USDC|PERP).*$/i,"").toUpperCase()}
const KNOWN=new Set(("AAPL ABBV ABNB AMD AMGN AMZN ARM AVGO BA BABA BAC BE BIDU BMY BRK.B CAT CCL CMCSA COIN COHR COST CRM CRCL CSCO CVX DELL DIS ETN F GEV GFS GME GOOG GOOGL GS HD HIMS HOOD HPE IBM INTC JNJ JPM LITE LLY MA MARA MCD META MRK MRNA MRVL MSFT MU NFLX NKE NVDA OKLO ORCL PANW PEP PFE PLTR PYPL QCOM QQQ RDDT RIOT RKLB SBUX SMCI SNDK SOFI SPY STX TGT TSM TSLA UBER UNH V VRT WDC WMT XOM").split(" "));
const EXCLUDE=new Set(("BTC ETH SOL HYPE XRP DOGE ADA AVAX LINK SUI BNB BCH LTC TRX TON DOT AAVE UNI ENA PUMP XMR ZEC GOLD SILVER OIL CL NG EUR GBP JPY CHF AUD CAD NZD DXY US10Y SPX NDX DJI VIX").split(" "));
function stockCandidate(t){if(KNOWN.has(t))return true;if(EXCLUDE.has(t))return false;return /^[A-Z]{1,5}$/.test(t)}
async function discover(){const pd=await post({type:"perpDexs"}),dexs=(pd||[]).filter(Boolean);let assets=[];for(const d of dexs){let mc;try{mc=await post({type:"metaAndAssetCtxs",dex:d.name})}catch(e){continue}const meta=mc?.[0],ctx=mc?.[1]||[];(meta?.universe||[]).forEach((u,i)=>{const coin=canon(d.name,u.name),ticker=sym(coin),c=ctx[i]||{};if(stockCandidate(ticker))assets.push({dex:d.name,full:d.fullName||d.name,coin,ticker,mid:+c.midPx||+c.markPx||NaN,vol:+c.dayNtlVlm||0})});await sleep(80)}const m=new Map();assets.forEach(x=>{if(Number.isFinite(x.mid))m.set(x.coin,x)});return{dexs,assets:[...m.values()]}}
async function change(r,min){const now=Date.now(),start=now-(min+20)*60000,interval=min>=1440?"1d":(min===60?"1h":"5m");try{const c=await post({type:"candleSnapshot",req:{coin:r.coin,interval,startTime:start,endTime:now}});if(!Array.isArray(c)||!c.length)return NaN;const target=now-min*60000;let chosen=c[0];for(const b of c){const t=+(b.t??b.T??0);if(t<=target)chosen=b;else break}const base=+(chosen.c??chosen.o);return base>0&&Number.isFinite(r.mid)?(r.mid/base-1)*100:NaN}catch(e){return NaN}}
function price(x){if(!Number.isFinite(x))return"—";if(Math.abs(x)>=1000)return x.toLocaleString(undefined,{maximumFractionDigits:2});if(Math.abs(x)>=1)return x.toFixed(3);return x.toPrecision(5)}
function pct(x){return Number.isFinite(x)?(x>=0?"+":"")+x.toFixed(2)+"%":"—"}
function table(k){const q=$("#q").value.trim().toUpperCase(),lim=+$("#limit").value;const a=rows.filter(x=>!q||x.ticker.includes(q)).filter(x=>Number.isFinite(x[k])).sort((a,b)=>direction*(b[k]-a[k])).slice(0,lim);if(!a.length)return'<div class="info">正在读取，或当前没有可计算的标的。</div>';let s='<table><thead><tr><th># 标的</th><th>现价</th><th>涨跌</th><th>24h成交额</th></tr></thead><tbody>';a.forEach((x,i)=>s+=`<tr><td><b>${i+1}. ${x.ticker}</b><span class="badge">${x.dex}</span></td><td>${price(x.mid)}</td><td class="${x[k]>=0?"up":"dn"}">${pct(x[k])}</td><td class="muted">${x.vol?"$"+Math.round(x.vol).toLocaleString():"—"}</td></tr>`);return s+"</tbody></table>"}
function render(){$("#m5").innerHTML=table("m5");$("#m15").innerHTML=table("m15");$("#h1").innerHTML=table("h1");$("#d1").innerHTML=table("d1")}
async function scan(){if(busy)return;busy=true;last=Date.now();$("#status").textContent="读取 HIP-3 DEX…";try{const{dexs,assets}=await discover();rows=assets;$("#info").textContent=`发现 ${dexs.length} 个 HIP-3 DEX；识别到 ${assets.length} 个美股/ETF候选，正在计算 5m / 15m / 1h / 1天。`;$("#debug").textContent="DEX: "+dexs.map(x=>x.name+" ("+(x.fullName||x.name)+")").join(", ")+"\n\n识别资产:\n"+assets.map(x=>x.coin).join(", ");let done=0;await Promise.all(Array.from({length:3},async(_,w)=>{for(let i=w;i<assets.length;i+=3){const x=assets[i];x.m5=await change(x,5);await sleep(100);x.m15=await change(x,15);await sleep(100);x.h1=await change(x,60);await sleep(100);x.d1=await change(x,1440);await sleep(100);done++;if(done%3===0){render();$("#status").textContent=`计算 ${done}/${assets.length}`}}}));render();$("#status").textContent=`已更新 · ${new Date().toLocaleTimeString()}`}catch(e){$("#status").textContent="连接失败："+e.message;$("#debug").textContent=String(e)}busy=false}
$("#up").onclick=()=>{direction=1;$("#up").classList.add("active");$("#down").classList.remove("active");render()};$("#down").onclick=()=>{direction=-1;$("#down").classList.add("active");$("#up").classList.remove("active");render()};$("#q").oninput=render;$("#limit").onchange=render;$("#refresh").onclick=scan;scan();setInterval(()=>{if(Date.now()-last>=30000)scan()},30000);
</script></body></html>
